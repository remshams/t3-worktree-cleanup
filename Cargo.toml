[package]
name = "t3-worktree-cleanup"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "1.0.2", default-features = false, features = ["std", "serde"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
